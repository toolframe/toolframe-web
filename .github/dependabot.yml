version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    commit-message:
      prefix: chore(ci)
    pull-request-branch-name:
      prefix: chore
      template: '{prefix}/{name}'
    groups:
      actions-dependencies:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
