name: Publish Python distribution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  release-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - name: Require the exact package version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PYCODE'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          expected = 'refs/tags/v' + project['version']
          if os.environ['RELEASE_REF'] != expected:
              raise SystemExit('Publication requires ' + expected)
          PYCODE

  validate:
    needs: release-tag
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  compatibility:
    uses: ./.github/workflows/compatibility.yml

  publish:
    needs: [release-tag, validate, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist-ubuntu-24.04
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          repository-url: https://upload.pypi.org/legacy/
